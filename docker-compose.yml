services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: estimator
      MYSQL_USER: estimator
      MYSQL_PASSWORD: estimator
    ports:
      - "3306:3306"
    volumes:
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: elasticsearch:8.15.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      network.host: "0.0.0.0"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  model-service:
    build:
      context: .
      dockerfile: ./model-service/Dockerfile
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  seed-es:
    build:
      context: .
      dockerfile: ./scripts/Dockerfile.seed
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: "no"

  estimator-backend:
    build: ./estimator-backend
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: mysql+pymysql://estimator:estimator@mysql:3306/estimator
      MODEL_SERVICE_URL: http://model-service:8000
    depends_on:
      mysql:
        condition: service_healthy
      model-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  market-backend:
    build: ./market-backend
    ports:
      - "8080:8080"
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
      MODEL_SERVICE_URL: http://model-service:8000
    depends_on:
      elasticsearch:
        condition: service_healthy
      model-service:
        condition: service_healthy
      seed-es:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  portal:
    build:
      context: ./portal
      args:
        NEXT_PUBLIC_MODEL_SERVICE_URL: http://localhost:8000
        NEXT_PUBLIC_ESTIMATOR_URL: http://localhost:8001
        NEXT_PUBLIC_MARKET_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      estimator-backend:
        condition: service_healthy
      market-backend:
        condition: service_healthy

volumes:
  mysql_data:
  es_data:
